services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: go_vue_admin
      MYSQL_USER: go_vue_admin
      MYSQL_PASSWORD: go_vue_admin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  goravel:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: go_vue_admin
      DB_USERNAME: go_vue_admin
      DB_PASSWORD: go_vue_admin
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
